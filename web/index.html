<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Z-Agent 财经助手</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<main>
    <aside>
        <div class="brand">Z-Agent <span>FINANCE</span></div>
        <button id="new">+ 新对话</button>
        <h2>会话</h2>
        <div id="sessions"></div>
    </aside>
    <section>
        <header>
            <div><small>金融研究助手</small>
                <h1 id="title">新对话</h1></div>
            <span id="status">就绪</span></header>
        <div id="messages" aria-live="polite">
            <div class="empty">问我市场、公司或财经新闻。</div>
        </div>
        <form id="composer"><textarea id="question" placeholder="输入你的问题，Enter 发送，Shift + Enter 换行"
                                      required></textarea>
            <button>发送</button>
        </form>
    </section>
</main>
<script src="app.js"></script>
</body>
</html>
