skillsPath: "skills"

agent:
  # 单个聊天请求允许模型发起的最大工具调用轮次；未配置时默认为 15。
  maxSteps: 15
  # 每轮带入模型的最近历史消息数量；未配置时默认为 20。
  historyLimit: 20

exec:
  allowedCommands:
    - "ls"
    - "cat"
    - "grep"
    - "find"
    - "curl"
    - "python3"
    - "wc"
    - "head"
    - "tail"
    - "sort"
    - "uniq"
    - "awk"
    - "sed"
  timeout: 60

mcp:
  - name: "finance"
    endpoint: "http://localhost:8085/mcp"

redis:
  addr: "localhost:6379"
  password: ""
  DB: 1

providers:
  primary:
    type: "openai-compatible"
    baseURL: "https://token-plan-cn.xiaomimimo.com/v1"
    apiKeyEnv: "API_KEY"
    model: "mimo-v2.5"
    temperature: 1
  fallback: []
