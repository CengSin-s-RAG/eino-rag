ragPromptPath: "systemPrompt.md"
skillsPath: "skills"

exec:
  allowedCommands:
    - "ls"
    - "cat"
    - "grep"
    - "find"
    - "curl"
    - "python3"
    - "wc"
    - "head"
    - "tail"
    - "sort"
    - "uniq"
    - "awk"
    - "sed"
  timeout: 60

rerank:
  prompt: "rerankSystemPrompt.txt"
  url: "http://localhost:8086/v2/rerank"

rewrite:
  prompt: "rewriteSystemPrompt.txt"
  url: "http://localhost:8086/v2/rewrite"

qdrant:
  host: "localhost"
  port: 6334

mcpServer: "http://localhost:8085/mcp"

redis:
  addr: "localhost:6379"
  password: ""
  DB: 1

ivankaContent:
  host: "localhost"
  port: 3306
  userName: "root"
  password: "rootpassword"
  DB: "ivanka_content"

provider:

